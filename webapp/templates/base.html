<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}HSeeker{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none'><path d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z' stroke='%2339d5ab' stroke-width='1.5'/><path d='M8 8l8 8M16 8L8 16' stroke='%2339d5ab' stroke-width='1.5' stroke-linecap='round'/><circle cx='8' cy='8' r='1.5' fill='%2339d5ab'/><circle cx='16' cy='8' r='1.5' fill='%2339d5ab'/><circle cx='8' cy='16' r='1.5' fill='%2339d5ab'/><circle cx='16' cy='16' r='1.5' fill='%2339d5ab'/></svg>" type="image/svg+xml">
  <meta name="description" content="H-DNA / Triplex Mirror Repeat Detector — fast genomic structure analysis">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Plotly.js -->
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>

  <!-- Alpine.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>

  <link rel="stylesheet" href="/static/css/style.css">
  {% block head %}{% endblock %}
</head>
<body>

  <nav class="nav">
    <div class="nav-inner">
      <a href="/" class="brand">
        <svg class="brand-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z" stroke="currentColor" stroke-width="1.5"/>
          <path d="M8 8l8 8M16 8L8 16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <circle cx="8" cy="8" r="1.5" fill="currentColor"/>
          <circle cx="16" cy="8" r="1.5" fill="currentColor"/>
          <circle cx="8" cy="16" r="1.5" fill="currentColor"/>
          <circle cx="16" cy="16" r="1.5" fill="currentColor"/>
        </svg>
        <span class="brand-name">H<span class="brand-accent">Seeker</span></span>
        <span class="brand-divider">|</span>
        <span class="brand-sub">H-DNA Detection</span>
      </a>
      <div class="nav-links">
        <a href="https://github.com/Georgakopoulos-Soares-lab/HDNAhunter"
           class="nav-link" target="_blank" rel="noopener noreferrer">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="currentColor" style="vertical-align:-2px; margin-right:4px">
            <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
          </svg>GitHub
        </a>
        <a href="https://pypi.org/project/hseeker/" class="nav-link" target="_blank" rel="noopener noreferrer">PyPI</a>
        <span class="nav-version">v{{ hseeker_version }}</span>
      </div>
    </div>
  </nav>

  <main class="main">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <span>HSeeker v{{ hseeker_version }} — H-DNA / Triplex Mirror Repeat Detector</span>
      <span class="footer-sep">·</span>
      <a href="https://www.georgakopoulos-soares-lab.com/" class="footer-link" target="_blank" rel="noopener noreferrer">Georgakopoulos-Soares Lab</a>
      <span class="footer-sep">·</span>
      <span>MIT License</span>
    </div>
  </footer>

</body>
</html>
