name: Build and publish wheels

# Trigger on version tags (v0.1.0, v1.2.3, …), main pushes, or manually
on:
  push:
    tags:
      - "v*"
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------------
  # Build binary wheels for every platform using cibuildwheel
  # -------------------------------------------------------------------------
  build_wheels:
    name: Wheels · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set build version
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import re

          pyproject = Path("pyproject.toml")
          init_py = Path("src/hseeker/__init__.py")
          c_file = Path("src/hseeker/_hdna.c")

          version_match = re.search(r'^version = "([^"]+)"$', pyproject.read_text(), re.M)
          if not version_match:
              raise SystemExit("Could not find project version")

          base_version = version_match.group(1)
          ref = os.environ["GITHUB_REF"]
          if ref.startswith("refs/tags/v"):
              build_version = ref.removeprefix("refs/tags/v")
          else:
              build_version = f"{base_version}.dev{os.environ['GITHUB_RUN_ID']}"

          replacements = (
              (pyproject, r'^version = "[^"]+"$', f'version = "{build_version}"'),
              (init_py, r'^__version__: str = "[^"]+"$', f'__version__: str = "{build_version}"'),
              (c_file, r'PyModule_AddStringConstant\(m, "__version__", "[^"]+"\);', f'PyModule_AddStringConstant(m, "__version__", "{build_version}");'),
          )

          for path, pattern, replacement in replacements:
              current = path.read_text()
              updated, count = re.subn(pattern, replacement, current, count=1, flags=re.M)
              if count != 1:
                  raise SystemExit(f"Failed to update {path}")
              path.write_text(updated)

          print(f"Using build version: {build_version}")
          PY

      # Set up QEMU so we can build aarch64 wheels on x86_64 Linux runners
      - name: Set up QEMU (Linux aarch64)
        if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.19
        # cibuildwheel reads all settings from [tool.cibuildwheel] in pyproject.toml

      - name: Upload wheels artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  # -------------------------------------------------------------------------
  # Build source distribution (sdist) — contains the C source so that
  # users on unsupported platforms can still compile from source.
  # -------------------------------------------------------------------------
  build_sdist:
    name: Source distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set build version
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import re

          pyproject = Path("pyproject.toml")
          init_py = Path("src/hseeker/__init__.py")
          c_file = Path("src/hseeker/_hdna.c")

          version_match = re.search(r'^version = "([^"]+)"$', pyproject.read_text(), re.M)
          if not version_match:
              raise SystemExit("Could not find project version")

          base_version = version_match.group(1)
          ref = os.environ["GITHUB_REF"]
          if ref.startswith("refs/tags/v"):
              build_version = ref.removeprefix("refs/tags/v")
          else:
              build_version = f"{base_version}.dev{os.environ['GITHUB_RUN_ID']}"

          replacements = (
              (pyproject, r'^version = "[^"]+"$', f'version = "{build_version}"'),
              (init_py, r'^__version__: str = "[^"]+"$', f'__version__: str = "{build_version}"'),
              (c_file, r'PyModule_AddStringConstant\(m, "__version__", "[^"]+"\);', f'PyModule_AddStringConstant(m, "__version__", "{build_version}");'),
          )

          for path, pattern, replacement in replacements:
              current = path.read_text()
              updated, count = re.subn(pattern, replacement, current, count=1, flags=re.M)
              if count != 1:
                  raise SystemExit(f"Failed to update {path}")
              path.write_text(updated)

          print(f"Using build version: {build_version}")
          PY

      - name: Install build
        run: pip install build

      - name: Build sdist
        run: python -m build --sdist

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # -------------------------------------------------------------------------
  # Publish to PyPI after all wheels are built.
  # Runs only for version tags and manual dispatches.
  # Uses PyPI Trusted Publishing (OIDC) — no API token needed.
  # Set up: https://docs.pypi.org/trusted-publishers/
  # -------------------------------------------------------------------------
  publish:
    name: Publish to PyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')

    permissions:
      id-token: write   # required for OIDC trusted publishing

    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: Download sdist artifact
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
