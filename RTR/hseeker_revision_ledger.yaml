  - README.md 'Optional: CPU-native optimization'
  verify: default Linux source build log contains no -march=native; CI wheels build
  verified_result: >-
    PASS. Reviewer's reading confirmed exactly: ARCHFLAGS is macOS/cibuildwheel-only, so
    _is_cross_compiling() returned False for every Linux build and -march=native was
    applied unconditionally, producing non-portable binaries (SIGILL risk on other hosts).
    Now opt-in via HSEEKER_NATIVE=1, with the cross-compile guard retained as a second
    safety net. Real build matrix (grep -c march=native on forced rebuilds):
    default=0, HSEEKER_NATIVE=1 -> 1, HSEEKER_NATIVE=0 -> 0,
    HSEEKER_NATIVE=1+ARCHFLAGS=-arch ppc64 -> 0. cibuildwheel sets no HSEEKER_NATIVE,
    so CI wheels are now built portably. Suite 149 passed / 3 skipped after restoring
    a default build.
  evidence: RTR/evidence/WS1-A1_march_native_optin.md
  last_updated: '2026-09-23'
