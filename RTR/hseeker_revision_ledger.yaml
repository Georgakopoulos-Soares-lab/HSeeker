    DONE 2026-09-23 for the DETECTION CALL; the stability-score threshold half remains open.
    Implemented all three schemes R3.2 names, meeting its 'ideally' bar not its minimum:
    leave-one-family-out (54 groups), leave-one-study-out (27 groups), and both collapsed
    variants. Leakage-safe grouping: synthetic negatives generated from an experimental
    positive INHERIT that positive's family and study (40 of 59 do), so holding out
    fam:pAA32 cannot leave its own mirror-disrupted mutant in the training portion.
    fam:pAA32 - the pXY32 series the reviewer names by name - is a single group of 34 of
    the 130 records. RESULT: the manuscript's pre-specified parameters win under every
    scheme - LOFO/LOSO sens 0.954 spec 0.985 MCC 0.939, vs per-fold tuned 0.895,
    script_default 0.908, production_cli 0.856. KEY INSIGHT verified not assumed: LOFO,
    LOSO and full-data evaluation are NUMERICALLY IDENTICAL (TP62 FN3 TN64 FP1) because
    with parameters fixed HSeeker's call depends only on the record's own sequence -
    nothing is fitted, so grouping CANNOT bias the point estimate. What family structure
    actually affects is PRECISION, exactly as R3.2 says ('inflate apparent statistical
    power'): the family-cluster CI is 1.26x wider than the record-level CI
    ([0.845,0.988] vs [0.877,0.985]), ratio 0.91-1.61 across all 14 reported rows.
