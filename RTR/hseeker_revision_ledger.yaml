- id: DEC-5
  question: 'Canonical benchmark parameters: adopt manuscript-stated values (mismatch=0.15, minrep=8, explicit Triplex args)
    as canonical and re-run?'
  status: pending
  decider: authors
  note: "Recommended: yes \u2014 the reviewed manuscript's values are canonical; record any number changes."
  evidence_update_2026-10-02: >-
    The empirical support previously cited for this recommendation no longer holds on the
    124-record benchmark (DEC-7). Out of fold the manuscript-stated config (purity 0.90,
    mismatch 0.15, minrep 8, maxspacer 10, both filters) and the script default (mismatch
    0.10, no filters) TIE: nested CV MCC 0.968 each, LOFO/LOSO 0.968 each; the script default
    is marginally ahead on the collapsed variants (0.862 vs 0.834; 0.943 vs 0.940) and on the
    single held-out split (0.949 vs 0.894). The filters change no call on this benchmark and
    mismatch 0.10 and 0.15 have the same median held-out MCC across the grid (0.788). Both
    fixed configs still beat per-fold tuning (nested CV 0.936, LOFO 0.920).
    TODO(authors): the data no longer favour 0.15 over 0.10, so DEC-5 must be decided on
    consistency with the reviewed manuscript rather than on benchmark performance.
  evidence_update_2026-10-07: >-
    Numbers in evidence_update_2026-10-02 are superseded by the 128-record benchmark
    (DEC-8); the conclusion is unchanged. Out of fold the manuscript-stated config and the
    script default still TIE: nested CV MCC 0.969 each (0.9688 vs 0.9692), LOFO/LOSO 0.969
    each; the script default is marginally ahead on the collapsed variants (0.862 vs 0.834;
    0.944 vs 0.942) and on the single held-out split (eval n=40; 1.000 vs 0.951). The filters
    still change no call, and mismatch 0.10 and 0.15 again have the same median held-out MCC
    across the grid (0.838). Both fixed configs still beat per-fold tuning (nested CV 0.938,
    LOFO 0.923). The 2026-10-02 TODO(authors) above still applies unchanged.
  evidence_update_2026-10-08: >-
    Configuration label corrected. 'script default' above means the analysis scripts'
    setting (run_direct_sensitivity_analysis.py, REFERENCES["script_default"] - minrep 8,
    mismatch 0.10, no filters), NOT the software default. On the 128-record benchmark it
    gives TP62 FN2 TN64 FP0, MCC 0.969 (experimental-only 62/2/5/0, MCC 0.832). The shipped
    software defaults use minrep 10 (library - no filters; CLI - both filters) and give
    TP56 FN8 TN64 FP0, MCC 0.882 (experimental-only 56/8/5/0, MCC 0.580). The manuscript
    configuration (minrep 8, mismatch 0.15, both filters) gives TP63 FN1 TN63 FP1, MCC 0.969
