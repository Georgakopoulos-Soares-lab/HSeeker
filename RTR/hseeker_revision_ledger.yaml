- id: DEC-9
  question: Which overlap-removal strategy should be the default?
  status: resolved
  status_note: default superseded by DEC-10 (2026-10-08) - greedy is the default again; score mode, its
    result-preserving optimisation and the PR #18 memory fix are kept
  superseded_by: DEC-10
  decider: authors
  resolution: >-
    (State as of 2026-10-07; the default part is superseded by DEC-10, see the end of this
    entry.) Score-informed overlap removal (Nikol's overlap_strategy="score") is the default
    whenever scoring is on. Library (scan_sequence, scan_fasta, scan_fasta_iter,
    scan_fasta_parallel) - overlap_strategy=None resolves to "score" when score=True and to
    "greedy" (the previous longest-arm rule) when score=False, since there is nothing to rank
    by (helper _resolve_overlap_strategy in src/hseeker/__init__.py). An explicit "score"
    with score=False still raises ValueError (unchanged). CLI - -overlap-strategy defaults to
    score, -no-score gives greedy, and the startup banner prints the overlap mode. Webapp -
    form default "score"; if scoring is unchecked the server falls back to greedy instead of
    returning 400. hseeker.ablation keeps its explicit per-model handling (greedy default
    there). README updated. Effect - no detection call changed on the benchmark (0
    binary-call differences greedy vs score across the full WS4-A3 grid, 576 configs x 128
    records = 73,728 calls, all four filter states), so no reported metric moves. Without
    the homopolymer filter a call cannot change (score selection keeps the top-scoring
    candidate); with it a call CAN differ in general - greedy's longest-arm pick may be a
    pure homopolymer that the filter drops, leaving nothing, while score can report an
    overlapping near-homopolymer candidate (ACGT x10 + G x100 + C x100 + ACGT x10 with the
    CLI filters - 0 hits greedy, 3 score). Also WHICH hit is reported in an overlapping cluster can change (GAMIR_SEQ -
    score keeps the higher-scoring arm-6 hit, greedy the arm-7 hit; GAAGGAAAGAAAGAAAGGG -
    score (3,19) vs greedy (1,17)). The WS3 smoke-test HSeeker values are unchanged.
    Score-based selection was also optimised, required to keep logic and results identical
    - incremental window search in _scoring.py (O(arm^3) -> O(arm^2) per hit, same terms in
    the same order), an O(arm) _Scorer.upper_bound(), and lazy score-ordered selection
    (__init__._score_and_select, POST homopolymer filter per hit; _filter_overlapping_hits
    unchanged). Timings on the development machine - poly-G 100/200/400 bp 0.43 / 6.5 / 96 s
    -> ~0.01 / 0.05 / 0.06 s; G3000+C2000+A5000 did not finish in minutes -> 5.4 s (greedy
    1.6 s); 2 Mb random genome with GA/CT islands 39 s -> 8.8 s (greedy 7.8 s); hg38 chr1
    (measured 2026-10-07, AMD EPYC 7763, 16 workers) ~60 s vs 26.3 s greedy - the genome-scale
    cost that led to DEC-10. Test suite before the optimisation with the score default - 35
    failures incl. 11 parallel-scan timeouts; after - all passing (~21 s; 344 passed, 3
    skipped as of 2026-10-08). Equivalence against the
    pre-optimisation code VERIFIED 2026-10-07 (one-off side-by-side harness, evidence
    section 4) - 70,984 candidates x 4 flag combinations in the scorer, 19,710 scan_sequence
    calls, scan_fasta / scan_fasta_iter / scan_fasta_parallel paths and long runs, all
    identical; the optimisation gives identical results to the pre-optimisation code.
    Remaining worst case - long G/C homopolymer runs with the homopolymer filter on (G400+C400
    40 s score vs 0.02 s greedy; cost grows roughly with the cube of the run length);
    -overlap-strategy greedy avoids it. This decision changes the production rule
    BEFORE the WS4-A4 comparison that was meant to gate it (see WS4-A4 and plan R3.10).
    SUPERSEDED 2026-10-08 (DEC-10) as far as the DEFAULT is concerned - the library, CLI and
    webapp defaults are greedy again (identical to Nikol's main d237bca), the
    _resolve_overlap_strategy None-default semantics and the webapp greedy fallback are
    gone, and the 24 greedy pins in tests/test_hdna.py are no longer needed. Score mode
    (overlap_strategy="score"), the optimisation above and its equivalence verification
    are kept unchanged.
  outputs:
  - src/hseeker/__init__.py - _resolve_overlap_strategy (default semantics; removed by DEC-10) and _score_and_select (lazy
    score-ordered selection replacing score-all -> POST filter -> _filter_overlapping_hits(score) in scan_sequence /
    scan_fasta / scan_fasta_parallel; kept)
  - src/hseeker/_scoring.py - incremental window search, _arms() factored out, set-based non-ACGT check,
    _Scorer.upper_bound()
  - src/hseeker/__main__.py - -overlap-strategy default None (score; greedy with -no-score), overlap mode in the banner
    (default reverted to greedy by DEC-10; the banner is kept)
  - webapp - form default score; greedy fallback when scoring is unchecked (reverted by DEC-10)
  - README.md - signatures, parameter tables, overlap-removal section with performance note
  - tests/test_score_overlap.py - test_default_is_score_with_scoring_and_greedy_without,
    test_cli_default_is_score_and_no_score_falls_back_to_greedy (replace
    test_greedy_remains_the_default_in_public_api), test_lazy_score_selection_matches_scoring_every_candidate (12
    cases), test_incremental_window_search_matches_naive_recomputation (300 random arms; bound >= score); the two
    default-semantics tests were replaced by greedy-default tests under DEC-10, the equivalence guards are kept
  - tests/test_hdna.py - 24 detector-geometry tests pinned overlap_strategy="greedy" (they assert the longest-arm hit);
    the pins are gone since DEC-10
  evidence: RTR/evidence/DEC-9_score_overlap_default_and_optimisation.md
  resolved_date: '2026-10-07'
- id: DEC-10
  question: Which overlap-removal strategy should be the default, given score mode's genome-scale cost?
  status: resolved
  decider: authors
  supersedes: DEC-9 (default only)
  resolution: >-
    Author instruction 2026-10-08 - "make the greedy the default". overlap_strategy defaults
    to "greedy" in the library (scan_sequence, scan_fasta, scan_fasta_iter,
    scan_fasta_parallel), whether or not scoring is on; the CLI -overlap-strategy defaults to
    greedy and the startup banner now prints the overlap mode; the webapp form defaults to
    greedy, and choosing score with scoring off returns HTTP 400, as in Nikol's original code.
    These defaults are identical to Nikol's main (d237bca). An explicit
    overlap_strategy="score" with score=False still raises ValueError. REASON - the
    genome-scale cost of score mode, measured on hg38 chr1 on an AMD EPYC 7763 with 16 vCPUs
    (the manuscript benchmark node's CPU model) - score ~60 s vs greedy 26.3 s at 16 workers
    (205.2 vs 172.1 s at 1 worker); published triplex 57.7 s. A further pure-Python
    optimisation (staged bounds) gave identical output but no speedup and was reverted; a
    C-level selection was not done. KEPT FROM DEC-9 - score mode as an option, with its
    verified result-preserving optimisation (DEC-9 evidence sections 3-4), and the PR #18
    memory fix (chr1 peak RSS 2,704 -> 1,979 MB; output-neutral; not yet committed). EFFECTS -
    benchmark detection metrics unchanged (0 of 73,728 WS4-A3 grid calls differ between the
    rules). The published speed numbers (25.2 s chr1 at 16 workers; '2.3x faster than
    triplex') and the chr1 count 96,729 describe the DEFAULT mode again - greedy reproduces
    96,729 exactly and runs in 26.3 s on the same CPU model - subject to re-measurement on the
    final code (X6) and to committing the memory fix. The near-homopolymer edge-hit
    TODO(authors) (plan R3.10) concerns only the optional score mode. R3.10 must now justify
    KEEPING the longest-arm default (speed) while offering score mode, using the chr1
    comparison (score mode retains every greedy locus, 100 % overlapped; 83.7 % identical
    coordinates; +1.5 % loci, 98,223 vs 96,729; ~2.3x runtime), and recommend a mode (greedy
    for genome-wide scans; score where the most stable overlapping variant matters;
    -skipoverlap for exhaustive analysis); the R3.10 TODO(authors) on how to justify the
    choice is reworded for DEC-10. R3.11 - the published runtime and hit numbers are valid
    for the default again; the whole-genome figure is still an extrapolation and must be
