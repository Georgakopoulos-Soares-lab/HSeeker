- id: DEC-2
  question: 'FXN records (HDNA0060-0063): confirm intended citation (candidate: Wells 2008 FASEB J, PMID 18211957)?'
  status: blocked_on_author
  decider: authors
  evidence: RTR/evidence/DEC-2_fxn_citation.md
  evidence_date: '2026-09-23'
  findings: >-
    Current citation disproved two independent ways: cited_pmid 18024960 = Romney 2008 JBC
    (C. elegans FTN-1 iron enhancer; likely FTN-1/FXN gene-symbol confusion) and cited_doi
    10.1074/jbc.R700013200 = Samuel 2007 JBC innate-immunity minireview - two different
    unrelated papers. The recorded title matches Rajeswari 2012 J Biosci 37:519-32
    (PMID 22750988) more closely than the audit's candidate Wells 2008 FASEB J
    (PMID 18211957); both are REVIEWS, so neither promotes these records to primary.
    No primary source found for n=10/20/33/66: Sakamoto 1999 Mol Cell (PMID 10230399)
    used 75-270 repeats and reports sticky DNA requires >59 repeats, so the 'forming'
    label for GAA10/GAA20/GAA33 is itself unsupported by any source traced here.
    Separately, all 4 records are marked verification_status=citation_corrected while
    carrying NO correction - the only 4 rows in that state; this must be made truthful
    whichever option is chosen.
  options: 'A=Wells 2008; B=Rajeswari 2012; C=supply primary source (only route to primary
    disposition); D=drop the 4 records (65->61 forming, forces rebalance)'
- id: DEC-3
  question: Add pRW1406=(TTC)8 as a new verified primary forming record?
  status: blocked_on_author
  decider: authors
  evidence: RTR/evidence/DEC-3_pRW1406.md
  evidence_date: '2026-09-23'
  findings: >-
    Hanvey 1988 JBC (PMID 2835375) full abstract retrieved and quoted. It names seven
    inserts and states the five at 66-25% G+C adopt a non-B conformation best explained
    by an intramolecular triple-stranded model. (TTC)8.(GAA)8 at 33% G+C is one of those
    five, so BOTH its sequence and its forming label are established by the primary source.
    Confirmed absent from the benchmark (exact and reverse-complement search over all 80
    rows). All five existing Hanvey records' labels agree with the abstract. However the
    abstract names only the vector pRW790, never construct numbers - the pRW#### mapping
    comes from the same secondary document already shown corrupted for this study
    (it listed pRW1406 with the (TCC)8 sequence). Recommend adding under a content-derived
    name (Hanvey1988_(TTC)8) rather than re-importing the unverifiable plasmid number.
    Second candidate G19.C19 is also missing but the abstract says its conformation
    DIFFERS from the other five - recommend NOT adding it as forming (HDNA0080-class
    label-scope risk).
  options: 'A=add as Hanvey1988_(TTC)8, disposition primary (RECOMMENDED); B=add as pRW1406;
    C=do not add. A or B => 72 kept (66/6), 60 primary, balanced 132 at 66:66, regenerate
    synthetic negatives'
- id: DEC-4
  question: Confirm MYCAA (HDNA0034) promotion to primary after figure-level check of Belotserkovskii 2007 Fig. 2?
  status: resolved
  decider: authors
  resolution: 'Mooted: HDNA0034 removed with all low-confidence-tier records (author decision 2026-09-23).'
