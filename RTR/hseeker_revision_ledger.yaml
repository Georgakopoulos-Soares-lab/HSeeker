- id: WS4-A3
  workstream: WS4_robustness
  reviewer_items:
  - R3.9
  status: in_progress
  depends_on:
  - WS2-A1
  inputs:
  - hdna_benchmark_experimental_v3.csv
  outputs:
  - parameter_sweep.csv: purity 0.85-1.0
  - mismatch 0.0-0.15
  - minrep 8-12
  - maxspacer 5-15
  verify: sensitivity/specificity/MCC per setting; one-at-a-time around canonical config
  primary_estimate: >-
    Repeated stratified 5-fold nested CV (20 repeats, every record held out once per
    repeat, pooled out-of-fold over all 130 records). Design fixed a priori, NOT chosen
    by comparing results - picking a flattering partition would reintroduce R3.3's
    circularity at the split level. RESULT: the manuscript's own pre-specified parameters
    (mismatch 0.15, minrep 8, purity 0.90, maxspacer 10, both filters) give
    sens 0.954 / spec 0.985 / MCC 0.939 [0.877, 0.985] and BEAT per-fold tuning
    (MCC 0.909 [0.857, 0.985]); script_default 0.908, production_cli 0.856. Tuning adds
    selection variance without signal. THIS is the configuration to report: best
    performing AND most defensible, because nothing was selected on the data, so R3.3
    does not apply to it at all. Selection-frequency across 100 outer folds: minrep=8 and
    purity=0.85 in 100% of folds, some composition filter in 100% (AT 86% / homopolymer
    14%), maxspacer=10 in 77%, mismatch=0.10 in only 60% - mismatch is the least settled
    axis, exactly the one DEC-5 asks about, and the fixed 0.15 wins out of fold.
    CV correctness: exact partition of all 130 records in every one of 20x5 folds, all
    folds class-balanced within 1, every pooled confusion sums to 130, selection-frequency
    totals 100 per axis. Zero-width across-repeat intervals for FIXED configs are expected,
    not a defect (a fixed config predicts each record identically regardless of fold), so
    record-level bootstrap CIs were added for the headline numbers.
  progress: >-
    DONE 2026-09-23 for the detection-parameter half of R3.9; PROVISIONAL (pre-freeze,
    pre-DEC-5) and the scoring-component ablation half remains open as WS4-A2.
    Design per author instruction: 65:65 balanced set only, SEQUENCE-level stratified
    70/30 split (train 90 at 45:45, eval 40 at 20:20, seed 20260923), full factorial
    576 configs (purity x mismatch x minrep x maxspacer x filter-state), selection by
    max MCC on TRAIN only with a deterministic simplicity-preferring tie-break,
    evaluated once on the held-out split. Upgraded from the plan's one-at-a-time sweep
    to full factorial because compute was negligible (14.7 s for the whole matrix).
    HEADLINE: tuning does NOT reliably beat the shipped default - over 200 repeated
    splits the median tuned-minus-default eval MCC is exactly +0.0000 (95% [-0.0955,
    +0.1001]), winning 99/200, tied 43, losing 58. The surface is broad: 108 of 576
    configs lie within 0.05 MCC of the maximum and 75 tie at it. Parameter importance
    by spread in median eval MCC: minrep 0.278 (dominant) > mismatch 0.166 >
    maxspacer 0.083 > filter-state 0.060 > purity 0.041. The three filter states are
    indistinguishable from each other and all beat 'none', consistent with every false
    positive being a homopolymer. INFORMS DEC-5: mismatch=0.15, the manuscript's stated
    value, has the best median eval MCC (0.860), and the manuscript's full stated
    configuration ties the tuned one on held-out data (MCC 0.951) - so adopting the
    manuscript values as canonical is supported by data, not just by consistency.
    CORRECTNESS: 10 checks pass including determinism (byte-identical re-run), grid
    completeness, hand-recomputed Wilson CI, and 6 grid cells recomputed from direct
    hseeker calls. Two initial FAILs were defects in the CHECKING code (label
    'non_forming' vs normalised 'non-forming'; rounded-vs-unrounded MCC comparison),
    both re-verified after correction and recorded rather than quietly fixed.
    PARITY CAVEAT: this is sequence-level by instruction, so it does NOT answer R3.2.
    Leakage measured, not assumed - of 40 eval records, 24 share a family with train,
    8 have a >=90% identical train record, and 7 synthetic negatives have their source
    record in train. The held-out estimate is therefore optimistic relative to a
    family-aware design and must not be presented as answering R3.2.
  evidence: RTR/evidence/WS4-A3_parameter_robustness.md
  outputs_deposited: analysis/results/robustness_v3/ (grid_train_metrics.csv,
    grid_eval_metrics.csv, selected_vs_reference.csv, split_manifest.csv,
    leakage_audit.csv, repeated_split_stability.csv, metadata.json)
  script: analysis/scripts/run_parameter_robustness.py
  last_updated: '2026-09-23'
