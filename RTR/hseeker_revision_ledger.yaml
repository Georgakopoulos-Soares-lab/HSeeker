  - tests/test_hdna.py::test_profiling_counters_are_thread_local
  verify: parallel chr1-chunk scan returns identical hits; counters per-call if kept
  verified_result: >-
    PASS, and the defect was larger than the reviewer stated. Measured pre-fix: 8 concurrent
    scans of IDENTICAL input returned 8 distinct totals, none correct, max inner_iters
    6,993,228 vs single-thread baseline 1,823,346 = 3.84x inflation - counts were not just
    lost but cross-contaminated between threads. Fixed with thread-local storage rather than
    atomics, deliberately: the counters increment in the innermost loop (1.8M times/scan) so
    an atomic RMW per iteration would tax the hot path the paper's speed claim rests on.
    Post-fix all 8 threads report exactly the baseline. Parallel results verified unchanged:
    workers=2/4/8/16, 3 repeats each, digest identical to serial. Regression test confirmed
    to FAIL on the pre-fix build and pass on the fixed build. Suite 150 passed / 3 skipped.
    No published manuscript number is affected - these counters are diagnostic-only with no
    consumer anywhere in the repo; benchmark timings come from /usr/bin/time -v and
    perf_counter.
