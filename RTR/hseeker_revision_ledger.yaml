- id: DEC-1
  question: 'AG32-30nt (HDNA0033): relabel non-forming citing Rooney & Moore 1995, or exclude?'
  status: resolved
  decider: authors
  resolution: 'Mooted: HDNA0033 removed with all low-confidence-tier records (author decision 2026-09-23).'
